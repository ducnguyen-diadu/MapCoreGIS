    <script src="assets/js/vi.js"></script>
    <script src="assets/js/en.js"></script>
    <script>
        const core = new WaterMapCore('map', {
            ui: { toolbar: 'left', layerPanel: 'left', attributePanel: 'right' },
            storage: { guestRetentionDays: 7, isAuthenticated: () => false },
            map: {
                zoomControl: false,
                minZoom: 2,
                maxZoom: 35,
                maxNativeZoom: 19
            },
            attributeTable: {
                pageSize: 50,
                mode: "bottom"
            },
            plugins: [
                WaterMapI18n({
                    defaultLocale: "vi",
                    fallbackLocale: "vi",

                    locales: {
                        vi: WATERMAP_LANG_VI,
                        en: WATERMAP_LANG_EN
                    }
                })
            ]
        });
        window.core = core;
        core.on('ready', () => console.log('WaterMapCore ready', WaterMapCore.VERSION));
    </script>
