    <script>
        document.addEventListener('DOMContentLoaded', function () {

            // ==========================================
            // 1. KHỞI TẠO BẢN ĐỒ LEAFLET
            // ==========================================
            // Thiết lập tọa độ trung tâm mặc định (ví dụ: Tọa độ Việt Nam hoặc khu vực dự án) và mức phóng to (zoom)
            const map = L.map('map').setView([16.047079, 108.206230], 13);

            // Thêm lớp nền bản đồ từ OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);




            // ==========================================
            // 2. XỬ LÝ ĐÓNG/MỞ MENU MOBILE
            // ==========================================
            const toggle = document.getElementById('mobileMenuToggle');
            const close = document.getElementById('mobileMenuClose');
            const panel = document.getElementById('mobileSidePanel');
            const overlay = document.getElementById('mobileMenuOverlay');

            if (toggle && close && panel && overlay) {
                function openMobileMenu() {
                    panel.classList.add('show');
                    overlay.classList.add('show');
                    panel.setAttribute('aria-hidden', 'false');
                    toggle.setAttribute('aria-expanded', 'true');
                    document.body.style.overflow = 'hidden';
                }

                function closeMobileMenu() {
                    panel.classList.remove('show');
                    overlay.classList.remove('show');
                    panel.setAttribute('aria-hidden', 'true');
                    toggle.setAttribute('aria-expanded', 'false');
                    document.body.style.overflow = '';
                }

                toggle.addEventListener('click', openMobileMenu);
                close.addEventListener('click', closeMobileMenu);
                overlay.addEventListener('click', closeMobileMenu);

                panel.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', closeMobileMenu);
                });

                document.addEventListener('keydown', function (event) {
                    if (event.key === 'Escape') {
                        closeMobileMenu();
                    }
                });
            }

            // ==========================================
            // 3. XỬ LÝ ACTIVE LINK KHI CHUYỂN TRANG
            // ==========================================
            function getControllerName(path) {
                const clean = path.toLowerCase().split('?')[0].split('#')[0];
                const segments = clean.split('/').filter(s => s.length > 0);
                if (segments.length === 0) return 'home';
                if (segments[0] === 'index') return 'home';
                return segments[0];
            }
            const currentController = getControllerName(window.location.pathname);
            const navLinks = document.querySelectorAll("#mainMenu a, #mobileMenu a");

            navLinks.forEach(link => {
                const href = link.getAttribute("href");
                if (!href || href === "#") return;

                const linkController = getControllerName(href);

                if (linkController === currentController) {
                    link.classList.add("active");
                    link.classList.remove("fw-semibold");
                    link.classList.add("fw-bold");
                }
            });

            // ==========================================
            // 4. CHUYỂN ĐỔI NGÔN NGỮ (TIẾNG VIỆT / ENGLISH)
            // ==========================================
            const LANG_STORAGE_KEY = 'site-lang';
            const langToggleFlag = document.getElementById('langToggleFlag');
            const langToggleLabel = document.getElementById('langToggleLabel');
            const langOptions = document.querySelectorAll('.language-option');
            const translatable = document.querySelectorAll('[data-vi][data-en]');

            function applyLanguage(lang) {
                document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : 'vi');

                translatable.forEach(el => {
                    const text = el.getAttribute(lang === 'en' ? 'data-en' : 'data-vi');
                    if (text !== null) {
                        el.textContent = text;
                    }
                });

                const activeOption = document.querySelector(`.language-option[data-lang="${lang}"]`);
                if (activeOption && langToggleFlag && langToggleLabel) {
                    langToggleFlag.setAttribute('src', activeOption.getAttribute('data-flag'));
                    langToggleLabel.textContent = activeOption.getAttribute('data-label');
                }

                langOptions.forEach(opt => {
                    opt.classList.toggle('active', opt.getAttribute('data-lang') === lang);
                });
            }

            function setLanguage(lang) {
                localStorage.setItem(LANG_STORAGE_KEY, lang);
                applyLanguage(lang);
            }

            langOptions.forEach(opt => {
                opt.addEventListener('click', function (e) {
                    e.preventDefault();
                    setLanguage(this.getAttribute('data-lang'));
                });
            });

            const savedLang = localStorage.getItem(LANG_STORAGE_KEY) || 'vi';
            applyLanguage(savedLang);

            // ==========================================
            // 5. ĐỒNG BỘ MÀU FOOTER THEO NAVBAR (SÁNG/TỐI)
            // ==========================================
            const navbarEl = document.querySelector('.navbar-custom');
            const footerEl = document.querySelector('.footer-theme-synced');

            function syncFooterTheme() {
                if (!navbarEl || !footerEl) return;
                const navStyle = window.getComputedStyle(navbarEl);
                footerEl.style.backgroundColor = navStyle.backgroundColor;
                footerEl.style.color = navStyle.color;
                footerEl.style.borderTop = '1px solid ' + (navStyle.borderBottomColor || navStyle.color);
            }

            syncFooterTheme();

            const themeToggleBtn = document.getElementById('light-dark-mode');
            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', function () {
                    setTimeout(syncFooterTheme, 0);
                });
            }

            const themeObserver = new MutationObserver(syncFooterTheme);
            themeObserver.observe(document.documentElement, {
                attributes: true,
                attributeFilter: ['data-bs-theme']
            });

        });
